name: Deploy

# Deploys the site to Cloudflare Pages after CI passes on main.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-pages
  cancel-in-progress: false

jobs:
  pages:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://pulse.lungilemooketsi.engineer
    steps:
      - name: Checkout the commit CI tested
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      # The Collect and History workflows keep generated data on the data branch.
      - name: Add the latest generated data
        run: |
          mkdir -p public/data public/docs
          cp pipeline/LABELLING.md pipeline/PRICE_TEST.md public/docs/
          git fetch -q --depth=1 origin data || true
          for file in snapshot/sentiment.json history/history.json anomalies/anomalies.json; do
            name=$(basename "$file")
            if git show "origin/data:$file" > "public/data/$name" 2>/dev/null; then
              echo "Added $name"
            else
              rm -f "public/data/$name"
              echo "No $name yet; the pages that use it say so."
            fi
          done

      - name: Build
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
          VITE_API_URL: ${{ vars.VITE_API_URL }}

      # The build has no fallback for missing config, so stop before shipping a site that cannot sign in.
      - name: Check the build has its config
        env:
          REPO_VARS: ${{ toJSON(vars) }}
          API_URL: ${{ vars.VITE_API_URL }}
          AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
        run: |
          for name in VITE_FIREBASE_API_KEY VITE_FIREBASE_AUTH_DOMAIN VITE_FIREBASE_PROJECT_ID VITE_FIREBASE_STORAGE_BUCKET VITE_FIREBASE_MESSAGING_SENDER_ID VITE_FIREBASE_APP_ID VITE_API_URL CLOUDFLARE_ACCOUNT_ID; do
            jq -e --arg n "$name" '(.[$n] // "") | length > 0' <<<"$REPO_VARS" >/dev/null || { echo "Repository variable $name is not set"; exit 1; }
          done
          grep -qF "$API_URL" dist/assets/*.js || { echo "VITE_API_URL is missing from the build"; exit 1; }
          grep -qF "$AUTH_DOMAIN" dist/assets/*.js || { echo "Firebase config is missing from the build"; exit 1; }

      - name: Install Worker dependencies
        run: npm ci --prefix worker

      - name: Deploy to Cloudflare Pages
        run: >
          npx --prefix worker wrangler pages deploy dist
          --project-name astro-pulse
          --branch main
          --commit-hash "${{ github.event.workflow_run.head_sha || github.sha }}"
          --commit-dirty=false
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
